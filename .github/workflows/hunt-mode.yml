name: Fortress Hunt Mode - Telegram Signals
on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 minutos de verdad (dos veces por hora: min 0 y min 30)
  workflow_dispatch:
    inputs:
      force_test_trade:
        description: '¿Forzar una operación de PRUEBA en BTC para chequear que todo funcione?'
        type: boolean
        default: false

concurrency:
  group: hunt-mode
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias (web-push, para las notificaciones push)
        run: npm install
      - name: Ejecutar el escáner y enviar señales a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_TEST_TRADE: ${{ github.event.inputs.force_test_trade }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node telegram-bot/scan.js
      - name: Guardar el estado (para no repetir alertas y no perder la cuenta de TheHaton)
        if: always()
        run: |
          git config user.name "fortress-bot"
          git config user.email "bot@users.noreply.github.com"
          git add telegram-bot/state.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: actualizar estado del hunt mode [skip ci]"
          for i in 1 2 3; do
            if git push; then break; fi
            echo "Push rechazado, reintentando con pull --rebase ($i/3)..."
            git pull --rebase --autostash
            sleep 3
          done
