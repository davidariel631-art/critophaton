name: Fortress Hunt Mode - Telegram Signals

on:
  schedule:
    - cron: '0 * * * *'   # cada 1 hora, en punto
  workflow_dispatch:
    inputs:
      force_test_trade:
        description: '¿Forzar una operación de PRUEBA en BTC para chequear que todo funcione?'
        type: boolean
        default: false

# Evita que dos corridas se pisen (ej: una corrida manual justo cuando arranca la programada),
# que es justo lo que causó el error de "git push rejected" — en vez de correr en paralelo,
# la nueva corrida espera a que termine la anterior.
concurrency:
  group: hunt-mode
  cancel-in-progress: false

permissions:
  contents: write            # necesario para que el bot pueda guardar el estado (dedupe + cuenta TheHaton)

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # Node 20 quedó obsoleto en los runners de GitHub Actions

      - name: Ejecutar el escáner y enviar señales a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_TEST_TRADE: ${{ github.event.inputs.force_test_trade }}
        run: node telegram-bot/scan.js

      - name: Guardar el estado (para no repetir alertas y no perder la cuenta de TheHaton)
        if: always()
        run: |
          git config user.name "fortress-bot"
          git config user.email "bot@users.noreply.github.com"
          git add telegram-bot/state.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: actualizar estado del hunt mode [skip ci]"
          # Defensa extra (además de "concurrency" arriba): si el push falla porque el remoto
          # cambió mientras tanto, se trae lo nuevo y se reintenta, en vez de perder la corrida.
          for i in 1 2 3; do
            if git push; then break; fi
            echo "Push rechazado, reintentando con pull --rebase ($i/3)..."
            git pull --rebase --autostash
            sleep 3
          done
